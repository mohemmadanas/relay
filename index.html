<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Relay</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#2a303b; --text:#e6e9ef; --dim:#8b93a3; --accent:#4f8cff; --me:#1f3b6e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .hidden { display:none !important; }
  #login { max-width:340px; margin:20vh auto; padding:16px; text-align:center; }
  input, button, textarea { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--dim); border-color:var(--line); }
  #app { display:grid; grid-template-columns: 1fr 320px; height:100vh; }
  @media (max-width:760px) { #app { grid-template-columns:1fr; grid-template-rows: 1fr auto; } #side { max-height:40vh; } }
  #chat { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header b { flex:1; }
  header input { width:90px; padding:6px 8px; }
  #live { font-size:12px; color:var(--dim); }
  #live.on { color:#3ecf8e; }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:75%; padding:8px 12px; border-radius:10px; background:var(--panel); white-space:pre-wrap; word-break:break-word; }
  .m.me { align-self:flex-end; background:var(--me); }
  .m small { display:block; color:var(--dim); font-size:12px; }
  form#send { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  form#send textarea { flex:1; resize:none; height:44px; }
  #side { display:flex; flex-direction:column; min-height:0; }
  #drop { margin:12px; min-height:160px; padding:24px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:2px dashed var(--line); border-radius:12px; text-align:center; color:var(--dim); cursor:pointer; }
  #drop:hover { border-color:var(--accent); color:var(--text); }
  #drop .big { font-size:34px; line-height:1; }
  #dz { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; margin:10px; border:4px dashed var(--accent); border-radius:16px; background:rgba(14,17,22,.88); color:var(--text); font-size:28px; pointer-events:none; }
  #prog { margin:0 12px; color:var(--dim); font-size:13px; min-height:18px; }
  #files { flex:1; overflow-y:auto; padding:0 12px 12px; }
  .f { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line); }
  .f a { flex:1; color:var(--accent); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .f span { color:var(--dim); font-size:12px; white-space:nowrap; }
  .f button { padding:2px 8px; font-size:12px; }
  .m.file { cursor:pointer; } .m.file:hover { outline:1px solid var(--accent); }
  #pv { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; background:rgba(8,10,14,.96); }
  #pv header { border:0; }
  #pv header b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pvinfo { color:var(--dim); font-size:13px; white-space:nowrap; }
  #pvbody { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 12px 12px; color:var(--dim); }
  #pvbody img, #pvbody video { max-width:100%; max-height:100%; object-fit:contain; }
  #pvbody iframe { width:100%; height:100%; border:0; background:#fff; border-radius:6px; }
  #pvbody pre { width:100%; max-height:100%; margin:0; overflow:auto; padding:12px; border-radius:8px; background:var(--panel); color:var(--text); white-space:pre-wrap; word-break:break-word; }
  #pvbody audio { width:min(520px, 100%); }
  .nav { position:absolute; top:50%; transform:translateY(-50%); padding:10px 16px; font-size:24px; background:rgba(23,27,34,.85); }
  #prev { left:12px; } #next { right:12px; }
</style>
</head>
<body>
<div id="login">
  <h2>Relay</h2>
  <form id="lf"><input id="pw" type="password" placeholder="password" autocomplete="off" autofocus style="width:100%"><br><br>
  <button style="width:100%">Enter</button></form>
  <p id="lerr" style="color:#ff6b6b"></p>
</div>

<div id="app" class="hidden">
  <section id="chat">
    <header><b>Relay</b> <span id="live" title="live = instant updates; polling = checks every few seconds">● polling</span> name <input id="who"> <button class="ghost" id="clear" title="Delete all messages for everyone (files stay)">Clear chat</button> <button class="ghost" id="out">Log out</button></header>
    <div id="msgs"></div>
    <form id="send"><textarea id="txt" placeholder="Message (Enter to send, Shift+Enter newline)"></textarea><button>Send</button></form>
  </section>
  <aside id="side">
    <div id="drop"><span class="big">⬆</span><b>Drop files anywhere</b><span>or click here to pick (up to 1GB each)</span></div>
    <input type="file" id="pick" multiple class="hidden">
    <div id="prog"></div>
    <div id="files"></div>
  </aside>
</div>

<div id="dz" class="hidden">⬆ Drop to upload</div>

<div id="pv" class="hidden">
  <header><b id="pvname"></b> <span id="pvinfo"></span> <button id="pvdl">Download</button> <button class="ghost" id="pvx" title="Close (Esc)">✕</button></header>
  <div id="pvbody"></div>
  <button class="ghost nav" id="prev" title="Previous (←)">‹</button>
  <button class="ghost nav" id="next" title="Next (→)">›</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous"></script>
<script>
// Public anon key: only opens the content-free "changed" channel; tables and files are locked to the API.
const SB_URL = 'https://cdzfidmmdscwskxjjnjn.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkemZpZG1tZHNjd3NreGpqbmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5Njk0MzksImV4cCI6MjEwNzU0NTQzOX0.TUbb0ugYnvPhUTeQtA5I5FuaQcW9kSdjThKGCk1UYZo';
const API = 'https://cdzfidmmdscwskxjjnjn.supabase.co/functions/v1/relay';
const $ = s => document.querySelector(s);
const store = {
  get: k => { try { return sessionStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
};
let token = store.get('token'), lastId = 0, timer, rt, channel, live = false;
const who = $('#who');
who.value = (() => { try { return localStorage.getItem('who'); } catch { return null; } })()
  || (/Windows/.test(navigator.userAgent) ? 'PC' : /Mac/.test(navigator.userAgent) ? 'Mac' : 'Phone');
who.onchange = () => { try { localStorage.setItem('who', who.value); } catch {} };

async function api(path, body) {
  const r = await fetch(API + path, body === undefined
    ? { headers: { 'x-relay-token': token || '' } }
    : { method: 'POST', headers: { 'x-relay-token': token || '', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 401) { logout(); throw new Error('login'); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
function logout() { closePreview(); token = null; store.set('token', null); clearTimeout(timer); if (channel) { rt.removeChannel(channel); channel = null; } setLive(false); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
function showApp() { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); lastId = 0; $('#msgs').innerHTML = ''; tick(); loadFiles(); schedule(); connectLive(); }

// Live nudges when the websocket is up (10s safety poll); otherwise poll every 2s. Background tabs: 30s.
function setLive(on) { live = on; $('#live').textContent = on ? '● live' : '● polling'; $('#live').classList.toggle('on', on); }
function schedule() {
  clearTimeout(timer);
  if (!token) return;
  timer = setTimeout(async () => { await tick(); schedule(); }, document.hidden ? 30000 : live ? 10000 : 2000);
}
document.addEventListener('visibilitychange', () => { if (token && !document.hidden) tick(); schedule(); });
async function connectLive() {
  try {
    const { room } = await api('/room');
    rt = rt || window.supabase.createClient(SB_URL, SB_ANON);
    if (channel) rt.removeChannel(channel);
    channel = rt.channel(room)
      .on('broadcast', { event: 'changed' }, ({ payload }) => { tick(); if (payload && payload.kind === 'files') loadFiles(); })
      .subscribe(status => { setLive(status === 'SUBSCRIBED'); schedule(); });
  } catch (e) { setLive(false); }
}

$('#lf').onsubmit = async e => {
  e.preventDefault();
  $('#lerr').textContent = '…';
  const r = await fetch(API + '/login', { method:'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
  const d = await r.json().catch(() => ({ error: 'network error' }));
  if (d.token) { token = d.token; store.set('token', token); $('#pw').value = ''; $('#lerr').textContent = ''; showApp(); }
  else $('#lerr').textContent = d.error;
};
$('#out').onclick = logout;

let busy = false;
async function tick() {
  if (busy) return; busy = true;
  try {
    const list = await api('/messages?since=' + lastId);
    const box = $('#msgs'), first = lastId === 0, atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    for (const m of list) {
      if (m.cleared) box.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'm' + (m.sender === who.value ? ' me' : '');
      const s = document.createElement('small');
      s.textContent = m.sender + ' · ' + new Date(m.created_at).toLocaleTimeString();
      d.append(s, document.createTextNode(m.body));
      if (m.file) { d.classList.add('file'); d.title = 'Open ' + m.file; d.onclick = () => openFile(m.file); }
      box.append(d);
      lastId = m.id;
      if (m.file && !first) loadFiles();
    }
    if (list.length && (atBottom || first)) box.scrollTop = box.scrollHeight;
  } catch (e) {} finally { busy = false; }
}

$('#send').onsubmit = async e => {
  e.preventDefault();
  const text = $('#txt').value.trim();
  if (!text) return;
  $('#txt').value = '';
  try { await api('/messages', { text, from: who.value }); tick(); }
  catch (e) { if (!$('#txt').value) $('#txt').value = text; $('#prog').textContent = '✗ message not sent: ' + e.message; }
};
$('#clear').onclick = async () => {
  if (!confirm('Delete all chat messages for everyone? Files are kept.')) return;
  try { await api('/clear-chat', { from: who.value }); tick(); }
  catch (e) { $('#prog').textContent = '✗ clear failed: ' + e.message; }
};
$('#txt').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send').requestSubmit(); } };

function fmt(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(1) + ' MB'; }
let files = [];
async function loadFiles() {
  let list;
  try { list = await api('/files'); } catch (e) { return; }
  files = list;
  const box = $('#files'); box.innerHTML = '';
  for (const f of list) {
    const row = document.createElement('div'); row.className = 'f';
    const a = document.createElement('a'); a.textContent = f.name; a.title = (kind(f) ? 'Preview ' : 'Download ') + f.name;
    a.onclick = () => kind(f) ? preview(f) : download(f);
    const s = document.createElement('span'); s.textContent = fmt(f.size);
    const dl = document.createElement('button'); dl.className = 'ghost'; dl.textContent = '⬇'; dl.title = 'Download';
    dl.onclick = () => download(f);
    const del = document.createElement('button'); del.className = 'ghost'; del.textContent = '✕'; del.title = 'Delete';
    del.onclick = async () => { if (confirm('Delete ' + f.name + '?')) { await api('/delete', { name: f.name }); loadFiles(); } };
    row.append(a, s, dl, del); box.append(row);
  }
}
async function openFile(name) {
  if (!files.some(f => f.name === name)) await loadFiles();
  const f = files.find(f => f.name === name);
  if (!f) { $('#prog').textContent = `✗ ${name} was deleted`; return; }
  kind(f) ? preview(f) : download(f);
}

function put(url, blob, onprog) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => onprog(e.loaded);
    x.onload = () => x.status < 300 ? res() : rej(new Error(x.responseText || x.status));
    x.onerror = () => rej(new Error('network error'));
    x.send(blob);
  });
}
async function upload(file) {
  let name;
  try {
    const r = await api('/upload-url', { name: file.name, size: file.size });
    name = r.name;
    let done = 0;
    for (let i = 0; i < r.urls.length; i++) {
      const blob = file.slice(i * r.chunk, (i + 1) * r.chunk);
      for (let attempt = 1; ; attempt++) {
        try {
          await put(r.urls[i], blob, n => { $('#prog').textContent = `${file.name}: ${Math.round((done + n) / Math.max(file.size, 1) * 100)}%`; });
          break;
        } catch (e) { if (attempt >= 3) throw e; }
      }
      done += blob.size;
    }
    await api('/upload-done', { name });
    await api('/messages', { text: '📎 sent file: ' + name, from: who.value, file: name });
    $('#prog').textContent = `✓ ${name}`;
  } catch (e) {
    if (name) api('/delete', { name }).catch(() => {});
    $('#prog').textContent = `✗ ${file.name}: ${e.message}`;
  }
}
// Stored objects are untyped octet-stream (and big files are split), so previews are fetched
// into a Blob typed from the extension. HTML/SVG are never previewed: they could run script here.
const KINDS = {
  image: 'jpg jpeg png gif webp bmp avif heic heif',
  video: 'mp4 webm mov m4v',
  audio: 'mp3 wav m4a aac ogg oga opus flac',
  pdf: 'pdf',
  text: 'txt md csv tsv json log xml yml yaml ini conf py js ts css sh bat ps1 c cpp h java sql',
};
const MIME = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif', webp:'image/webp', bmp:'image/bmp',
  avif:'image/avif', heic:'image/heic', heif:'image/heif', mp4:'video/mp4', m4v:'video/mp4', webm:'video/webm',
  mov:'video/quicktime', mp3:'audio/mpeg', wav:'audio/wav', m4a:'audio/mp4', aac:'audio/aac', ogg:'audio/ogg',
  oga:'audio/ogg', opus:'audio/ogg', flac:'audio/flac', pdf:'application/pdf' };
const ext = name => name.includes('.') ? name.split('.').pop().toLowerCase() : '';
function kind(f) {
  const k = Object.keys(KINDS).find(k => KINDS[k].split(' ').includes(ext(f.name)));
  return k && f.size <= (k === 'text' ? 5 : 500) * 1048576 ? k : null;
}
async function fetchBlob(f, onprog, signal) {
  const { urls } = await api('/download-url', { name: f.name });
  const chunks = [];
  let got = 0;
  for (let i = 0; i < urls.length; i++) {
    const r = await fetch(urls[i], { signal });
    if (!r.ok) throw new Error('part ' + (i + 1) + ' failed');
    const reader = r.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length; onprog(got);
    }
  }
  return new Blob(chunks, { type: MIME[ext(f.name)] || '' });
}
function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function download(f) {
  try {
    const { urls } = await api('/download-url', { name: f.name });
    if (urls.length === 1) { location.href = urls[0]; return; }
    const blob = await fetchBlob(f, n => { $('#prog').textContent = `⬇ ${f.name}: ${Math.round(n / f.size * 100)}%`; });
    save(blob, f.name);
    $('#prog').textContent = `✓ downloaded ${f.name}`;
  } catch (e) { $('#prog').textContent = `✗ ${f.name}: ${e.message}`; }
}

let pv = null, pvCtl = null;
const note = text => { const d = document.createElement('div'); d.textContent = text; return d; };
function closePreview() {
  if (pvCtl) pvCtl.abort();
  if (pv && pv.url) URL.revokeObjectURL(pv.url);
  pv = null;
  $('#pvbody').innerHTML = '';
  $('#pv').classList.add('hidden');
}
async function preview(f) {
  closePreview();
  const k = kind(f), ctl = pvCtl = new AbortController(), body = $('#pvbody');
  pv = { f };
  $('#pv').classList.remove('hidden');
  $('#pvname').textContent = f.name;
  $('#pvinfo').textContent = fmt(f.size);
  const list = files.filter(kind), i = list.findIndex(x => x.name === f.name);
  $('#prev').classList.toggle('hidden', i <= 0);
  $('#next').classList.toggle('hidden', i < 0 || i >= list.length - 1);
  const msg = note('loading…');
  body.replaceChildren(msg);
  try {
    const blob = await fetchBlob(f, n => { msg.textContent = `loading ${Math.round(n / Math.max(f.size, 1) * 100)}%`; }, ctl.signal);
    if (ctl.signal.aborted) return;
    pv.blob = blob;
    const cant = () => body.replaceChildren(note(`This browser can't show .${ext(f.name)} files — use Download.`));
    let el;
    if (k === 'text') {
      el = document.createElement('pre');
      el.textContent = await blob.text();
    } else {
      pv.url = URL.createObjectURL(blob);
      el = document.createElement(k === 'image' ? 'img' : k === 'pdf' ? 'iframe' : k);
      if (k === 'video' || k === 'audio') { el.controls = true; el.autoplay = true; }
      el.onerror = cant;
      el.src = pv.url;
      if (k === 'image') el.alt = f.name;
    }
    body.replaceChildren(el);
  } catch (e) {
    if (!ctl.signal.aborted) body.replaceChildren(note('✗ ' + e.message));
  }
}
function step(d) {
  if (!pv) return;
  const list = files.filter(kind), i = list.findIndex(x => x.name === pv.f.name);
  if (i >= 0 && list[i + d]) preview(list[i + d]);
}
$('#pvx').onclick = closePreview;
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#pvdl').onclick = () => pv && (pv.blob ? save(pv.blob, pv.f.name) : download(pv.f));
document.addEventListener('keydown', e => {
  if (!pv) return;
  if (e.key === 'Escape') closePreview();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});
async function uploadAll(files) { for (const f of files) await upload(f); loadFiles(); tick(); }
const drop = $('#drop');
drop.onclick = () => $('#pick').click();
$('#pick').onchange = e => { uploadAll([...e.target.files]); e.target.value = ''; };
// Whole window is the drop zone. Counter avoids flicker as the drag crosses child elements.
let dragDepth = 0;
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes('Files');
const canDrop = () => token && !$('#app').classList.contains('hidden');
const dz = on => { if (!on) dragDepth = 0; $('#dz').classList.toggle('hidden', !on); };
document.addEventListener('dragenter', e => { if (!isFileDrag(e)) return; e.preventDefault(); if (canDrop()) { dragDepth++; dz(true); } });
document.addEventListener('dragover', e => { if (!isFileDrag(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = canDrop() ? 'copy' : 'none'; });
document.addEventListener('dragleave', e => { if (isFileDrag(e) && --dragDepth <= 0) dz(false); });
document.addEventListener('drop', e => { if (!isFileDrag(e)) return; e.preventDefault(); dz(false); if (canDrop()) uploadAll([...e.dataTransfer.files]); });

if (token) showApp();
</script>
</body>
</html>
