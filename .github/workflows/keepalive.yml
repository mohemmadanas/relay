# Supabase free projects pause after 7 days idle, so ping daily. On the 1st of each
# month also push an empty commit: GitHub disables crons after 60 days of repo inactivity.
name: keepalive
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 https://cdzfidmmdscwskxjjnjn.supabase.co/functions/v1/relay/ping
      - uses: actions/checkout@v4
      - run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date -u +%F)"
            git push
          fi
